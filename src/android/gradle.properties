org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# The Kotlin daemon is a separate JVM and does not inherit org.gradle.jvmargs.
# At ~300k lines (ChatViewModel.kt alone is 18k) its default heap hit
# "GC overhead limit exceeded" during compileDebugKotlin on the 7 GB CI runner.
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
