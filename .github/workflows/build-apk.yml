name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [release, debug]
        default: release
      application_id:
        description: "Override applicationId (empty = keep com.openminis.plus)"
        type: string
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: r28c
  # In-app updater checks this repo's releases (BuildConfig.UPDATE_REPO).
  UPDATE_REPO: ${{ github.repository }}
  GOMOBILE_VERSION: v0.0.0-20260813181013-1960c775504c

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Export NDK path
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "cmake;3.22.1" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------- proot (cached by submodule commit + build script) ----------
      - name: Resolve proot commit
        id: proot-rev
        run: echo "rev=$(git rev-parse HEAD:deps/proot)" >> "$GITHUB_OUTPUT"

      - name: Cache proot
        id: cache-proot
        uses: actions/cache@v4
        with:
          path: |
            src/android/app/src/main/assets/proot-aarch64
            src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
          key: proot-${{ env.NDK_VERSION }}-${{ steps.proot-rev.outputs.rev }}-${{ hashFiles('deps/build_proot.sh', 'deps/talloc/**') }}

      - name: Build proot
        run: |
          if [ "${{ steps.cache-proot.outputs.cache-hit }}" = "true" ]; then
            echo "proot restored from cache"
          else
            bash deps/build_proot.sh
          fi
          ls -la src/android/app/src/main/jniLibs/arm64-v8a/

      # ---------- Alpine rootfs ----------
      - name: Cache Alpine rootfs
        uses: actions/cache@v4
        with:
          path: src/android/app/src/main/assets/alpine-minirootfs.tar.gz
          key: alpine-${{ hashFiles('scripts/prepare_android_sandbox.sh') }}

      - name: Prepare Android sandbox
        run: bash scripts/prepare_android_sandbox.sh

      # ---------- rclone.aar (slowest step, cached by Go sources) ----------
      - name: Cache rclone.aar
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: deps/build/rclone/rclone.aar
          key: rclone-${{ env.NDK_VERSION }}-${{ hashFiles('deps/rclone-mobile/**', 'deps/build_rclone_android.sh') }}

      - name: Set up Go
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Build rclone.aar
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}
          go install golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          bash deps/build_rclone_android.sh

      - name: Install rclone.aar
        run: |
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      # ---------- build-time customization & signing ----------
      - name: Provider customization
        env:
          OAUTH_PROMPT: ${{ secrets.ANTHROPIC_OAUTH_IDENTIFIER_PROMPT }}
        run: |
          f=src/android/app/provider-customization.properties
          cp src/android/app/provider-customization.properties.example "$f"
          if [ -n "$OAUTH_PROMPT" ]; then
            python3 - "$f" <<'PY'
          import os, sys
          p = sys.argv[1]
          lines = [l for l in open(p) if not l.startswith("ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=")]
          v = os.environ["OAUTH_PROMPT"].replace("\\", "\\\\")
          lines.append("ANTHROPIC_OAUTH_IDENTIFIER_PROMPT=" + v + "\n")
          open(p, "w").writelines(lines)
          PY
          fi

      # The project signs every build type with signingConfigs.debug, i.e.
      # ~/.android/debug.keystore. Install a FIXED key from secrets so every CI
      # build has the same signature and can upgrade-install over the last one.
      - name: Install signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using fixed signing key from secrets"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 not set - random debug key, APKs will not upgrade-install over each other"
          fi

      - name: Override applicationId
        if: github.event_name == 'workflow_dispatch' && inputs.application_id != ''
        run: |
          sed -i 's/applicationId = "com.openminis.plus"/applicationId = "${{ inputs.application_id }}"/' src/android/app/build.gradle.kts
          grep -n 'applicationId =' src/android/app/build.gradle.kts

      # ---------- Gradle ----------
      - name: Assemble APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          BT="${{ inputs.build_type }}"
          [ -z "$BT" ] && BT=release
          TASK="assemble$(echo "${BT:0:1}" | tr a-z A-Z)${BT:1}"
          echo "BUILD_TYPE=$BT" >> "$GITHUB_ENV"
          ./gradlew ":app:$TASK" --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' src/android/app/build.gradle.kts | head -1)
          SHORT=$(git rev-parse --short HEAD)
          for f in $(find src/android/app/build/outputs/apk -name '*.apk'); do
            cp "$f" "out/OpenMinis-${VER}-${BUILD_TYPE}-${SHORT}.apk"
          done
          find src/android/app/build/outputs -name 'native-debug-symbols.zip' -exec cp {} out/ \;
          ls -la out
          "$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner" verify --print-certs out/*.apk | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-${{ env.BUILD_TYPE }}-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
